services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plex-ani-sync
      POSTGRES_PASSWORD: plex-ani-sync
      POSTGRES_DB: plex-ani-sync
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plex-ani-sync"]
      interval: 2s
      timeout: 3s
      retries: 15

  plex-ani-sync:
    build: .
    profiles: [app]
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: postgres://plex-ani-sync:plex-ani-sync@postgres:5432/plex-ani-sync?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set the OIDC issuer URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set the OIDC client id}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set the OIDC client secret}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set a base64 32 byte key, e.g. openssl rand -base64 32}
    depends_on:
      postgres:
        condition: service_healthy
